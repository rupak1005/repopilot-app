version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_USER: rp
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://rp:secret@db:5432/repopilot?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://api:3001"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:

