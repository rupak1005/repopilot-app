name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Build
        run: yarn build

  unit:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: repopilot
          POSTGRES_USER: rp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Enable pgvector and migrate
        env:
          DATABASE_URL: postgresql://rp:secret@localhost:5432/repopilot?schema=public
        run: |
          PGPASSWORD=secret psql -h localhost -U rp -d repopilot -c "CREATE EXTENSION IF NOT EXISTS vector;"
          yarn --cwd api prisma generate
          yarn --cwd api prisma migrate deploy

      - name: Unit tests with coverage
        env:
          TMPDIR: ${{ runner.temp }}
        run: yarn test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build packages for e2e
        env:
          SESSION_SECRET: e2e-test-session-secret-32chars-minimum
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999
        run: yarn build

      - name: E2E tests (100% UI route coverage)
        env:
          CI: 'true'
          E2E_PORT: '3099'
          SESSION_SECRET: e2e-test-session-secret-32chars-minimum
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
