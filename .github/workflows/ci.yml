name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: repopilot
          POSTGRES_USER: rp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Enable pgvector and migrate
        env:
          DATABASE_URL: postgresql://rp:secret@localhost:5432/repopilot?schema=public
        run: |
          PGPASSWORD=secret psql -h localhost -U rp -d repopilot -c "CREATE EXTENSION IF NOT EXISTS vector;"
          yarn --cwd api prisma generate
          yarn --cwd api prisma migrate deploy

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: yarn test
