# RepoPilot API on Fly.io
app = "repopilot-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "3001"
  INDEX_INLINE = "false"
  EMBEDDING_PROVIDER = "local"
  LLM_PROVIDER = "groq"
  REPO_CLONE_ROOT = "/data/repos"

[processes]
  app = "sh -c 'yarn --cwd api prisma generate && yarn --cwd api build && yarn --cwd api prisma migrate deploy && yarn --cwd api start'"
  worker = "sh -c 'yarn --cwd api prisma generate && yarn --cwd api build && yarn --cwd api worker'"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]

[mounts]
  source = "repopilot_repos"
  destination = "/data/repos"
  processes = ["app", "worker"]
